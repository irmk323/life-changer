<!doctype html><html lang="ja" xmlns:th="https://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Curriculum foundation</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="page"><header class="site-header"><a class="brand" th:href="@{/}">LeetCode Thinking Trainer</a></header><section class="page-heading"><h1>Curriculum foundation（read-only）</h1><p>この画面は将来のadaptive curriculum engine用の確認画面です。現在の13工程Attemptフローは置き換えていません。</p></section><section class="notice"><h2>Skill definitions</h2><ul><li th:each="skill:${skills}" th:text="${skill.code + ' — ' + skill.displayName}">Skill</li></ul></section><section class="notice"><h2>Mode requirements</h2><ul><li th:each="requirement:${requirements}" th:text="${requirement.learningMode + ' · ' + requirement.applicability + ' · order ' + requirement.displayOrder}">Requirement</li></ul></section><section class="notice"><h2>Curriculum coverage</h2><p th:text="${'Active items: ' + #lists.size(items)}">0</p><ul><li th:each="item:${items}" th:text="${item.role + ' · ' + item.problemId}">Item</li></ul></section><section class="notice"><h2>Problem exposure and learning sessions</h2><p th:text="${'Exposure snapshots: ' + #lists.size(exposures) + ' · Learning sessions: ' + #lists.size(sessions)}">Counts</p></section></main></body></html>
