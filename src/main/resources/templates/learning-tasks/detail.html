<!doctype html><html lang="ja" xmlns:th="https://www.thymeleaf.org"><body><main class="page"><a th:href="@{/learning-tasks}">課題一覧</a><h1 th:text="${task.title}">Task</h1><p th:text="${task.prompt}">prompt</p><h2>成功条件</h2><p th:text="${task.successCriteria}">criteria</p><form th:action="@{/learning-tasks/{code}/start(code=${task.code})}" method="post"><button class="button" type="submit">この課題を始める</button></form><h2>Profile stage map</h2><ul><li th:each="stage:${stages}" th:if="${stage.applicability.name() != 'NOT_APPLICABLE'}" th:text="${stage.displayOrder + '. ' + stage.displayName + ' — ' + stage.primaryQuestion}">stage</li></ul></main></body></html>
