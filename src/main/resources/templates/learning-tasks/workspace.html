<!doctype html><html lang="ja" xmlns:th="https://www.thymeleaf.org"><body><main class="page"><h1 th:text="${task.title}">Task</h1><p th:text="${task.prompt}">prompt</p><section><h2>必須の進行</h2><ol><li th:each="step:${requiredSteps}" th:text="${step.displayName + ' — ' + step.primaryQuestion}">step</li></ol></section><details th:if="${!#lists.isEmpty(optionalSteps)}"><summary>任意の追加工程</summary><ul><li th:each="step:${optionalSteps}" th:text="${step.displayName}">optional</li></ul></details><p th:if="${taskAttempt.status.name() == 'COMPLETED'}">完了済み（read-only）</p><form th:if="${taskAttempt.status.name() == 'COMPLETED'}" th:action="@{/learning-task-attempts/{id}/retry(id=${taskAttempt.id})}" method="post"><button type="submit">もう一度試す</button></form><form th:if="${taskAttempt.status.name() == 'IN_PROGRESS'}" th:action="@{/learning-task-attempts/{id}/contract(id=${taskAttempt.id})}" method="post"><h2>Four-line Contract</h2><label>この関数が返すもの<textarea name="functionContract" th:text="${taskAttempt.functionContract}"></textarea></label><label>最小入力と答え<textarea name="baseCase" th:text="${taskAttempt.baseCase}"></textarea></label><label>小さい同型問題<textarea name="subproblems" th:text="${taskAttempt.subproblems}"></textarea></label><label>子の答えの合成<textarea name="compositionRule" th:text="${taskAttempt.compositionRule}"></textarea></label><button type="submit">下書きを保存</button></form><form th:if="${taskAttempt.status.name() == 'IN_PROGRESS'}" th:action="@{/learning-task-attempts/{id}/complete(id=${taskAttempt.id})}" method="post"><button class="button" type="submit">課題を完了する</button></form></main></body></html>
