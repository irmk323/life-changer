<!doctype html>
<html lang="ja" xmlns:th="https://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>復習詳細</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="page"><header class="site-header"><a class="brand" th:href="@{/}">LeetCode Thinking Trainer</a><nav><a th:href="@{/reviews}">復習キュー</a></nav></header>
<section class="page-heading"><p class="eyebrow" th:text="${review.schedule.reviewType.displayName}">再構築</p><h1 th:text="${review.sourceProblem.title}">問題</h1><p th:text="${review.schedule.reviewType.purpose}">目的</p><p><strong th:text="${review.effectiveStatus.displayName}">状態</strong> · 予定日 <span th:text="${review.schedule.scheduledDate}">日付</span><span th:if="${review.overdueDays > 0}" th:text="${' · ' + review.overdueDays + '日超過'}"></span></p></section>
<p class="flash error" th:if="${error}" th:text="${error}"></p><p class="flash message" th:if="${message}" th:text="${message}"></p>
<section class="notice"><h2>この復習で確かめること</h2><p th:text="${review.schedule.assignmentNotes}">説明</p><p>もとの思考記録: <a th:href="@{/attempts/{id}(id=${review.schedule.sourceAttemptId})}">記録を開く</a></p><p th:if="${review.assignedProblem != null}">今回取り組む課題: <strong th:text="${review.assignedProblem.title}">課題</strong></p><h3>予定の記録</h3><p th:text="${'作成: ' + review.schedule.createdAt + ' / 最終更新: ' + review.schedule.updatedAt}">作成日時</p><p th:if="${review.schedule.rescheduleReason != null}" th:text="${'日程を変えた理由: ' + review.schedule.rescheduleReason}">理由</p></section>
<section class="notice" th:if="${review.assignedProblem == null && review.effectiveStatus != T(com.example.leetcodetrainer.review.domain.ReviewStatus).COMPLETED}"><h2>取り組む課題を選ぶ</h2><form th:action="@{/reviews/{id}/assign-problem(id=${review.schedule.id})}" method="post"><label>問題<select name="problemId"><option th:each="problem : ${activeProblems}" th:value="${problem.id}" th:text="${problem.title}">問題</option></select></label><button type="submit">この課題に決める</button></form></section>
<section class="notice" th:if="${review.schedule.completionAttemptId == null && review.assignedProblem != null}"><h2>復習を始める</h2><p>パターン名は最初は表示しません。まずは自分の観察から考え方を再構築してみましょう。</p><form th:action="@{/reviews/{id}/start(id=${review.schedule.id})}" method="post"><button class="button" type="submit">この復習を始める</button></form></section>
<section class="notice" th:if="${review.schedule.completionAttemptId != null}"><h2>復習を終えました</h2><p><a th:href="@{/attempts/{id}(id=${review.schedule.completionAttemptId})}">今回の思考記録を見る</a></p><form th:action="@{/reviews/{id}/follow-up(id=${review.schedule.id})}" method="post"><label>翌日も確認したい理由（任意）<input name="reason"></label><button type="submit">翌日の再確認を作る</button></form></section>
<section class="notice" th:if="${review.schedule.completionAttemptId == null}"><h2>予定を変更・取り消す</h2><form th:action="@{/reviews/{id}/reschedule(id=${review.schedule.id})}" method="post"><label>新しい予定日<input type="date" name="scheduledDate" required></label><label>理由（任意）<input name="reason"></label><button type="submit">予定日を変更する</button></form><form class="inline-form" th:action="@{/reviews/{id}/cancel(id=${review.schedule.id})}" method="post"><button type="submit">この復習を取り消す</button></form></section>
</main></body></html>
