<!doctype html>
<html lang="ja" xmlns:th="https://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>復習キュー</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="page"><header class="site-header"><a class="brand" th:href="@{/}">LeetCode Thinking Trainer</a><nav><a th:href="@{/problems}">問題一覧</a><a th:href="@{/reviews}">復習キュー</a></nav></header>
<section class="page-heading"><p class="eyebrow">復習の予定</p><h1>考え方を確かめ直す復習</h1><p>同じ問題での再構築、同型問題への転用、似た問題の比較、タグを見ない演習を、それぞれ別の記録として残します。</p></section>
<form class="filters" method="get"><label>表示<select name="filter"><option th:each="item : ${filters}" th:value="${item}" th:selected="${item == selectedFilter}" th:text="${item.displayName}">本日</option></select></label><label>種類<select name="type"><option value="">すべて</option><option th:each="item : ${types}" th:value="${item}" th:selected="${item == selectedType}" th:text="${item.displayName}">再構築</option></select></label><button class="button" type="submit">絞り込む</button></form>
<p class="count" th:text="${reviews.size() + ' 件'}">0件</p><section class="thinking-grid"><article th:each="item : ${reviews}"><p class="eyebrow" th:text="${item.schedule.reviewType.displayName}">再構築</p><h2 th:text="${item.sourceProblem.title}">問題</h2><p th:text="${item.schedule.reviewType.purpose}">目的</p><p><strong>予定日:</strong> <span th:text="${item.schedule.scheduledDate}">日付</span> · <span th:text="${item.effectiveStatus.displayName}">状態</span><span th:if="${item.overdueDays > 0}" th:text="${' · ' + item.overdueDays + '日超過'}"></span></p><p th:if="${item.assignedProblem != null}" th:text="${'取り組む課題: ' + item.assignedProblem.title}">課題</p><p th:if="${item.assignedProblem == null}">同型の別問題を選んでから始めます。</p><a th:href="@{/reviews/{id}(id=${item.schedule.id})}">内容を確認して始める →</a></article></section><p th:if="${#lists.isEmpty(reviews)}" class="notice">この条件に合う復習はありません。</p>
</main></body></html>
