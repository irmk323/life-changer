<!doctype html>
<html lang="ja" xmlns:th="https://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>演習結果</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="page"><header class="site-header"><a class="brand" th:href="@{/}">LeetCode Thinking Trainer</a><nav><a th:href="@{/problems}">問題一覧</a></nav></header>
<p class="flash message" th:if="${message}" th:text="${message}"></p><p class="flash error" th:if="${error}" th:text="${error}"></p>
<section class="page-heading"><p class="eyebrow">今回の学習結果</p><h1 th:text="${problem.title}">問題</h1><h2 th:text="${summary.outcomeTitle}">結果</h2><p th:text="${summary.outcomeDescription}">説明</p><p th:text="${'事前接触: ' + (attempt.priorExposure != null ? attempt.priorExposure.displayName : '未記録') + ' · 学習時間: ' + summary.durationDisplay}">時間</p><p class="flash error" th:if="${summary.durationWarning}">この時間には中断時間が含まれている可能性があります。学習時間の集計には使用していません。</p></section>
<section class="notice"><h2>今回確認できたこと</h2><p th:if="${#lists.isEmpty(summary.demonstrated)}">自力で確認できた工程の記録はまだありません。</p><ul><li th:each="item : ${summary.demonstrated}" th:text="${'✓ ' + item}">確認事項</li></ul></section>
<section class="notice"><h2>まだ確認できていないこと</h2><ul><li th:each="item : ${summary.unmeasured}" th:text="${item}">未測定</li></ul><a class="button" th:if="${!summary.quality.analysisAllowed}" th:href="@{/attempts/{id}/quick-assessment(id=${attempt.id})}">Quick Assessmentを始める</a></section>
<section class="notice"><h2>次に試すこと</h2><p th:text="${summary.nextAction}">次の行動</p></section>
<section class="notice"><h2>工程マップ</h2><div class="table-wrap"><table><thead><tr><th>工程</th><th>状態</th><th>ヒント</th></tr></thead><tbody><tr th:each="item : ${summary.stages}"><td th:text="${item.stage.order + '. ' + item.stage.displayName}">工程</td><td><span class="badge" th:text="${item.outcome}">自力</span></td><td th:text="${item.hintLevel == 0 ? 'なし' : 'Level ' + item.hintLevel}">なし</td></tr></tbody></table></div></section>
<section class="notice" th:if="${summary.quality.analysisAllowed}"><h2>今回の主なボトルネック</h2><p th:if="${summary.bottleneckAnalysis.primary == null}">明確なボトルネックは記録されませんでした。</p><div th:if="${summary.bottleneckAnalysis.primary != null}"><strong th:text="${summary.bottleneckAnalysis.primary.label.displayName}">候補</strong><p th:text="${summary.bottleneckAnalysis.primary.evidence.stage.displayName + 'で score ' + summary.bottleneckAnalysis.primary.evidence.score + '、Hint Level ' + summary.bottleneckAnalysis.primary.evidence.maxHintLevel + 'でした。'}">根拠</p></div></section>
<section class="notice" th:if="${!summary.quality.analysisAllowed}"><h2>工程別分析はまだ作成しません</h2><p th:text="${summary.quality.legacyAmbiguous ? '既存の0点に十分な操作根拠がないためです。' : '評価済み工程が不足しているためです。'}">理由</p></section>
</main></body></html>
