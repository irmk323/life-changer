<!doctype html>
<html lang="ja" xmlns:th="https://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>演習結果</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="page"><header class="site-header"><a class="brand" th:href="@{/}">LeetCode Thinking Trainer</a><nav><a th:href="@{/problems/{id}(id=${problem.id})}">問題詳細</a></nav></header>
<section class="page-heading"><p class="eyebrow">演習結果</p><h1 th:text="${problem.title}">問題</h1><p><span th:text="${attempt.status}">COMPLETED</span> · <span th:text="${attempt.finalResult != null ? attempt.finalResult.displayName : '最終結果なし'}">結果</span> · <span th:text="${attempt.durationSeconds != null ? attempt.durationSeconds + ' 秒' : '時間未計測'}">0 秒</span></p></section>
<section class="notice"><h2>工程別の自己評価</h2><ol class="result-list"><li th:each="stage : ${stages}"><strong th:text="${stage.stageType.order + '. ' + stage.stageType.displayName}">工程</strong><span th:text="${stage.score == null ? '未完了' : stage.score + '点'}">2点</span><p th:if="${stage.answer != null}" th:text="${stage.answer}">回答</p></li></ol></section>
</main></body></html>
