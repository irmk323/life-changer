<!doctype html><html lang="ja" xmlns:th="https://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quick Assessment</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="page"><header class="site-header"><a class="brand" th:href="@{/}">LeetCode Thinking Trainer</a></header><section class="page-heading"><h1>Quick Assessment</h1><p th:text="${problem.title + 'で、各工程を今回どう進められたか記録します。未入力は失敗として扱いません。'}">説明</p></section><form th:action="@{/attempts/{id}/quick-assessment(id=${attempt.id})}" method="post" class="notice"><div class="field-grid" th:each="stage : ${stages}"><strong th:text="${stage.stageType.displayName}">工程</strong><label>評価<select th:name="${'score:' + stage.stageType.name()}"><option value="">未評価</option><option value="2" th:selected="${stage.score == 2}">2: 自力でできた</option><option value="1" th:selected="${stage.score == 1}">1: ヒントがあればできた</option><option value="0" th:selected="${stage.score == 0}">0: まだできなかった</option></select></label><label>対象外・スキップ<select th:name="${'status:' + stage.stageType.name()}"><option value="NOT_STARTED">未評価</option><option value="SKIPPED" th:selected="${stage.assessmentStatus.name() == 'SKIPPED'}">スキップ</option><option value="NOT_APPLICABLE" th:selected="${stage.assessmentStatus.name() == 'NOT_APPLICABLE'}">対象外</option></select></label></div><button class="button" type="submit">Quick Assessmentを保存する</button></form></main></body></html>
