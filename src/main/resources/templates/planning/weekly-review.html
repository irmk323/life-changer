<!doctype html>
<html lang="ja" xmlns:th="https://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>今週の振り返り</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="page"><header class="site-header"><a class="brand" th:href="@{/}">LeetCode Thinking Trainer</a><nav><a th:href="@{/analytics}">分析</a></nav></header>
<section class="page-heading"><p class="eyebrow">Weekly Review</p><h1>今週、意識して確かめる工程</h1><p>完了した演習の記録から、次に重点的に確かめる思考工程を選びます。</p></section>
<section class="notice" th:if="${!focusRecommendation.available}"><p>異なる問題で3回以上Attemptを完了すると、工程別の傾向を提案します。</p></section>
<section class="notice" th:if="${focusRecommendation.available}"><h2>アプリからの提案</h2><p><strong th:text="${focusRecommendation.stage.displayName}">工程</strong></p><p th:text="${focusRecommendation.period.displayName + 'の自力成功率: ' + focusRecommendation.success.independentDisplay + '（n=' + focusRecommendation.sampleSize + '）'}">根拠</p></section>
<section class="notice" th:if="${activeWeeklyPlan != null}"><h2>現在のテーマ</h2><p th:text="${activeWeeklyPlan.focusStage.displayName}">工程</p></section>
<section class="notice"><h2>別の工程を選ぶ</h2><p>提案と異なる工程を意識したい場合だけ、ここで変更できます。</p><form method="post" th:action="@{/weekly-plans}" class="inline-form"><label>工程<select name="stage"><option th:each="stage : ${stageTypes}" th:value="${stage}" th:text="${stage.displayName}">工程</option></select></label><button type="submit">今週のテーマに変更する</button></form></section>
</main></body></html>
