<!doctype html>
<html lang="ja" xmlns:th="https://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${problem.title} + ' · 問題詳細'">問題詳細</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="page">
    <header class="site-header"><a class="brand" th:href="@{/}">LeetCode Thinking Trainer</a><nav><a th:href="@{/problems}">問題一覧</a><a th:href="@{/patterns}">パターン一覧</a></nav></header>
    <section class="page-heading"><p class="eyebrow">問題 metadata</p><h1 th:text="${problem.title}">Two Sum</h1><p><span th:text="${problem.difficulty}">EASY</span> · <span th:text="${problem.neetcodeCategory.displayName}">Arrays &amp; Hashing</span> · <span th:text="${problem.active ? '有効' : '無効'}">有効</span></p><a th:href="${problem.externalUrl}" target="_blank" rel="noopener noreferrer">LeetCodeで問題を開く ↗</a></section>
    <section class="notice"><h2>演習</h2><p>解けたかどうかだけでなく、解法に至る13の思考工程を記録します。開始後はパターンタグを隠します。</p><form th:action="@{/problems/{id}/attempts(id=${problem.id})}" method="post"><button class="button" type="submit">演習を開始する</button></form></section>
    <section class="notice"><h2>演習履歴</h2><p th:if="${#lists.isEmpty(attempts)}">まだ演習履歴はありません。</p><ul><li th:each="attempt : ${attempts}"><a th:if="${attempt.status.name() == 'IN_PROGRESS'}" th:href="@{/attempts/{id}/workspace(id=${attempt.id})}" th:text="${attempt.startedAt}">日時</a><a th:if="${attempt.status.name() != 'IN_PROGRESS'}" th:href="@{/attempts/{id}(id=${attempt.id})}" th:text="${attempt.startedAt}">日時</a><span th:text="${' · ' + attempt.status}"> · COMPLETED</span><span th:if="${attempt.finalResult != null}" th:text="${' · ' + attempt.finalResult.displayName}"></span></li></ul></section>
    <section class="notice"><h2>関連する思考パターン</h2><p th:if="${#lists.isEmpty(associations)}">関連パターンはまだありません。</p><ul><li th:each="association : ${associations}"><strong th:text="${association.primaryPattern ? '主要パターン: ' : '関連パターン: '}">主要パターン:</strong><a th:href="@{/patterns/{id}(id=${association.pattern.id})}" th:text="${association.pattern.name}">Hash Lookup</a><span th:if="${association.notes != null}" th:text="${' — ' + association.notes}"></span></li></ul></section>
</main></body></html>
