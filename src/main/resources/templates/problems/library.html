<!doctype html>
<html lang="ja" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>問題一覧 · LeetCode Thinking Trainer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page">
    <header class="site-header">
        <a class="brand" th:href="@{/}">LeetCode Thinking Trainer</a>
        <nav><a th:href="@{/problems}">問題一覧</a><a th:href="@{/patterns}">パターン一覧</a><a th:href="@{/status}">状態</a></nav>
    </header>
    <section class="page-heading">
        <p class="eyebrow">学習カタログ</p>
        <h1>問題一覧</h1>
        <p>問題文や公式解答は保存していません。演習では、問題名から解法を思い出すのではなく、自分の思考の道筋を記録します。</p>
    </section>
    <form class="filters" method="get" th:action="@{/problems}">
        <label>難易度
            <select name="difficulty">
                <option value="">すべて</option>
                <option th:each="item : ${difficulties}" th:value="${item}" th:text="${item}" th:selected="${item == selectedDifficulty}">EASY</option>
            </select>
        </label>
        <label>カテゴリ
            <select name="category">
                <option value="">すべて</option>
                <option th:each="item : ${categories}" th:value="${item}" th:text="${item.displayName}" th:selected="${item == selectedCategory}">Stack</option>
            </select>
        </label>
        <button class="button" type="submit">絞り込む</button>
        <a th:href="@{/problems}">解除</a>
    </form>
    <p class="count">演習できる問題: <span th:text="${#lists.size(problems)}">0</span> 件</p>
    <div class="table-wrap"><table class="problem-table"><thead><tr><th scope="col">番号</th><th scope="col">問題</th><th scope="col">難易度</th><th scope="col">カテゴリ</th><th scope="col"><span class="sr-only">操作</span></th></tr></thead><tbody>
        <tr th:each="problem : ${problems}" th:classappend="${problem.solved ? ' solved' : ''}">
            <td th:text="${problem.leetcodeNumber}">1</td>
            <td th:text="${problem.title}">Two Sum</td>
            <td><span class="badge" th:classappend="${' difficulty-' + #strings.toLowerCase(problem.difficulty.name())}" th:text="${problem.difficulty}">EASY</span></td>
            <td th:text="${problem.neetcodeCategory.displayName}">Arrays &amp; Hashing</td>
            <td class="problem-actions"><form th:action="@{/problems/{id}/attempts(id=${problem.id})}" method="post"><button type="submit">演習を開く</button></form><form th:action="@{/problems/{id}/toggle-solved(id=${problem.id})}" method="post"><button type="submit" th:aria-label="${problem.solved ? '解決済みを取り消す' : '解決済みにする'}">解いた</button></form></td>
        </tr>
    </tbody></table></div>
</main>
</body>
</html>
