<!doctype html>
<html lang="ja" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>問題一覧 · LeetCode Thinking Trainer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page">
    <header class="site-header">
        <a class="brand" th:href="@{/}">LeetCode Thinking Trainer</a>
        <nav><a th:href="@{/problems}">問題一覧</a><a th:href="@{/patterns}">パターン一覧</a><a th:href="@{/status}">状態</a></nav>
    </header>
    <section class="page-heading">
        <p class="eyebrow">学習カタログ</p>
        <h1>問題一覧</h1>
        <p>問題文や公式解答は保存していません。演習では、問題名から解法を思い出すのではなく、自分の思考の道筋を記録します。</p>
    </section>
    <form class="filters" method="get" th:action="@{/problems}">
        <label>難易度
            <select name="difficulty">
                <option value="">すべて</option>
                <option th:each="item : ${difficulties}" th:value="${item}" th:text="${item}" th:selected="${item == selectedDifficulty}">EASY</option>
            </select>
        </label>
        <label>カテゴリ
            <select name="category">
                <option value="">すべて</option>
                <option th:each="item : ${categories}" th:value="${item}" th:text="${item.displayName}" th:selected="${item == selectedCategory}">Stack</option>
            </select>
        </label>
        <button class="button" type="submit">絞り込む</button>
        <a th:href="@{/problems}">解除</a>
    </form>
    <p class="count">演習できる問題: <span th:text="${#lists.size(problems)}">0</span> 件</p>
    <div class="problem-grid">
        <article class="problem-card" th:each="problem : ${problems}">
            <div><span class="number" th:text="${problem.leetcodeNumber}">1</span><span class="badge" th:text="${problem.difficulty}">EASY</span></div>
            <h2 th:text="${problem.title}">Two Sum</h2>
            <p th:text="${problem.neetcodeCategory.displayName}">Arrays &amp; Hashing</p>
            <p>中心となる思考パターン: <span th:text="${primaryPatternNames.get(problem.id) != null ? primaryPatternNames.get(problem.id) : '未設定'}">Hash Lookup</span></p>
            <p th:text="${problem.active ? '状態: 有効' : '状態: 無効'}">状態: 有効</p>
            <a th:href="@{/problems/{id}(id=${problem.id})}">詳細を見る</a>
        </article>
    </div>
</main>
</body>
</html>
