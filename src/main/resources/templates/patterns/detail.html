<!doctype html>
<html lang="ja" xmlns:th="https://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${pattern.name} + ' · パターン詳細'">パターン詳細</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="page"><header class="site-header"><a class="brand" th:href="@{/}">LeetCode Thinking Trainer</a><nav><a th:href="@{/problems}">問題一覧</a><a th:href="@{/patterns}">パターン一覧</a></nav></header>
<section class="page-heading"><p class="eyebrow" th:text="${pattern.code}">MONOTONIC_STACK</p><h1 th:text="${pattern.name}">Monotonic Stack</h1><p th:text="${pattern.description}">説明</p></section>
<section class="thinking-grid"><article><h2>見つける手がかり</h2><p th:text="${pattern.triggerClues}"></p></article><article><h2>まず考える素直な方法</h2><p th:text="${pattern.typicalBruteForce}"></p></article><article><h2>繰り返している処理</h2><p th:text="${pattern.repeatedWork}"></p></article><article><h2>保持する状態・未確定の候補</h2><p th:text="${pattern.unresolvedState}"></p></article><article><h2>答えが決まるきっかけ</h2><p th:text="${pattern.resolutionEvent}"></p></article><article><h2>状態の参照・更新対象</h2><p th:text="${pattern.updatedRegion}"></p></article><article><h2>必要な操作</h2><p th:text="${pattern.requiredOperations}"></p></article><article><h2>保ち続ける条件</h2><p th:text="${pattern.invariantDescription}"></p></article><article><h2>正しさと計算量</h2><p th:text="${pattern.correctnessNotes}"></p><p th:text="${pattern.complexityNotes}"></p></article><article><h2>実装との対応</h2><p th:text="${pattern.javaNotes}"></p></article><article><h2>つまずきやすい点</h2><p th:text="${pattern.commonMistakes}"></p></article></section>
<section class="notice"><h2>関連問題</h2><ul><li th:each="association : ${associations}"><a th:href="@{/problems/{id}(id=${association.problem.id})}" th:text="${association.problem.title}">Daily Temperatures</a><span th:if="${association.primaryPattern}"> — 主要パターン</span></li></ul></section>
</main></body></html>
