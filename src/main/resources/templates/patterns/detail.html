<!doctype html>
<html lang="ja" xmlns:th="https://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${pattern.name} + ' · パターン詳細'">パターン詳細</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="page"><header class="site-header"><a class="brand" th:href="@{/}">LeetCode Thinking Trainer</a><nav><a th:href="@{/problems}">問題一覧</a><a th:href="@{/patterns}">パターン一覧</a></nav></header>
<section class="page-heading"><p class="eyebrow" th:text="${pattern.code}">MONOTONIC_STACK</p><h1 th:text="${pattern.name}">Monotonic Stack</h1><p th:text="${pattern.description}">説明</p></section>
<section class="thinking-grid"><article><h2>Trigger clues</h2><p th:text="${pattern.triggerClues}"></p></article><article><h2>Brute force</h2><p th:text="${pattern.typicalBruteForce}"></p></article><article><h2>Repeated work</h2><p th:text="${pattern.repeatedWork}"></p></article><article><h2>Unresolved state</h2><p th:text="${pattern.unresolvedState}"></p></article><article><h2>Resolution event</h2><p th:text="${pattern.resolutionEvent}"></p></article><article><h2>Updated region</h2><p th:text="${pattern.updatedRegion}"></p></article><article><h2>Required operations</h2><p th:text="${pattern.requiredOperations}"></p></article><article><h2>Invariant</h2><p th:text="${pattern.invariantDescription}"></p></article><article><h2>Correctness / complexity</h2><p th:text="${pattern.correctnessNotes}"></p><p th:text="${pattern.complexityNotes}"></p></article><article><h2>Common mistakes</h2><p th:text="${pattern.commonMistakes}"></p></article></section>
<section class="notice"><h2>関連問題</h2><ul><li th:each="association : ${associations}"><a th:href="@{/problems/{id}(id=${association.problem.id})}" th:text="${association.problem.title}">Daily Temperatures</a><span th:if="${association.primaryPattern}"> — 主要パターン</span></li></ul></section>
</main></body></html>
