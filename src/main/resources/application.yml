spring:
  application:
    name: leetcode-thinking-trainer
  datasource:
    url: jdbc:h2:file:${LEETCODE_TRAINER_DATA_DIR:${user.dir}/data}/leetcode-thinking-trainer;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  thymeleaf:
    cache: false

server:
  error:
    include-message: always
