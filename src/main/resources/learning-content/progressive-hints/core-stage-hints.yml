schemaVersion: 1
contentVersion: 1
stages:
  - stage: PROBLEM_RELATION
    level: 1
    content: "問題の物語を外し、入力のどの要素とどの条件・結果の関係を求めるかを書き出してください。"
  - stage: BRUTE_FORCE
    level: 1
    content: "まず小さい入力で必ず正しい手順を考え、どの候補をどの順番で調べるかを言葉にしてください。"
  - stage: REPEATED_WORK
    level: 1
    content: "総当たりの中で、同じ値・区間・候補をもう一度調べている部分はどこですか？"
  - stage: UNRESOLVED_STATE
    level: 1
    content: "ここまでに見た情報のうち、将来の入力を判断するために残す必要があるものは何ですか？"
  - stage: RESOLUTION_EVENT
    level: 1
    content: "新しい入力が来たとき、どの待機中の候補の答えが確定しますか？"
  - stage: UPDATED_REGION
    level: 1
    content: "保存した状態のうち、今回参照・追加・削除・確定するのはどの部分ですか？"
  - stage: REQUIRED_OPERATIONS
    level: 1
    content: "データ構造名の前に、必要な参照・追加・削除・検索・更新の操作を列挙してください。"
  - stage: DATA_STRUCTURE_SELECTION
    level: 1
    content: "必要な操作を最も自然に行える構造は何ですか。その操作との対応を説明してください。"
  - stage: INVARIANT
    level: 1
    content: "各反復の後にも常に正しいと言える、保存状態の内容・順序・範囲は何ですか？"
  - stage: CORRECTNESS_AND_COMPLEXITY
    level: 1
    content: "必要な答えを取りこぼさず、誤った候補を採用しない理由と、各要素を何回扱うかを説明してください。"
  - stage: IMPLEMENTATION
    level: 1
    content: "状態を表す変数、更新の順序、境界条件を小さい例で確認してからコードにしてください。"
  - stage: TRANSFER
    level: 1
    content: "見た目ではなく、求める関係・保持状態・確定イベントが同じかを比較してください。"
  - stage: REFLECTION
    level: 1
    content: "自力で進めた工程と補助が必要だった工程を分け、次回最初に確認する問いを一文で残してください。"
